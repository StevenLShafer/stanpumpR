# When a PR is opened, add a "DEPLOY" label if the PR came from this repo, so
# that shiny-pr-2-deploy.yaml deploys a preview of it.  A PR from a fork is
# never deployed (2026-11-02): the preview job runs the PR's code with the
# preview's shinyapps.io token, and a label once added covered every later push
# to the fork.  The fork's author is told so, and a maintainer who wants a
# preview reviews the fork and pushes its branch to this repository.
#
# MY_PAT is a personal access token, used because a label added with the
# workflow's own GITHUB_TOKEN would not trigger another workflow.  It reaches
# only the labelling step, which runs no PR code; it should be a fine-grained
# token limited to this repository and to issue and pull-request write.

name: Shiny PR 1 Triage

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label internal PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ secrets.MY_PAT }}
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['DEPLOY']
            });
      - name: Comment on fork PR
        if: github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "**Fork detected**\n\nFor security reasons a pull request from a fork is not deployed as a preview. A maintainer who wants one can review this branch and push it to the repository."
            });
