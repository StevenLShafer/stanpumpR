# Keeps the typeset notes in docs/ readable on GitHub.
#
# Each docs/X.tex has a committed docs/X.pdf, which is what the documentation
# links to.  This check compiles every docs/*.tex with pdflatex (twice, for
# cross-references) and fails if:
#   - the LaTeX does not compile, or leaves undefined references; or
#   - the committed PDF is missing, or its text differs from the fresh build
#     (the .tex was edited and the PDF was not rebuilt).
# When it fails, the freshly built PDFs are attached to the run as the
# artifact "docs-pdf": commit them, or run pdflatex twice locally.
#
# The check does not push to master itself: master is protected and requires
# R-CMD-check, which a bot commit would never get.  It is separate from
# R-CMD-check: docs/ is in .Rbuildignore, and this runs only when docs/*.tex
# or docs/*.pdf change.

name: docs-pdf

on:
  push:
    branches: [master]
    paths: ['docs/*.tex', 'docs/*.pdf', '.github/workflows/docs-pdf.yaml']
  pull_request:
    branches: [master]
    paths: ['docs/*.tex', 'docs/*.pdf', '.github/workflows/docs-pdf.yaml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            poppler-utils

      - name: Compile docs/*.tex and compare with the committed PDFs
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/build" "$RUNNER_TEMP/pdf"
          stale=0
          for tex in docs/*.tex; do
            name=$(basename "$tex" .tex)
            for pass in 1 2; do
              pdflatex -interaction=nonstopmode -halt-on-error \
                -output-directory "$RUNNER_TEMP/build" "$tex" > /dev/null \
                || { cat "$RUNNER_TEMP/build/$name.log"; exit 1; }
            done
            if grep -q "There were undefined references" "$RUNNER_TEMP/build/$name.log"; then
              echo "::error file=$tex::undefined references"; exit 1
            fi
            cp "$RUNNER_TEMP/build/$name.pdf" "$RUNNER_TEMP/pdf/"
            if [ ! -f "docs/$name.pdf" ]; then
              echo "::error file=$tex::docs/$name.pdf is missing; commit the compiled PDF"
              stale=1
            elif ! diff -q <(pdftotext -layout "docs/$name.pdf" -) \
                           <(pdftotext -layout "$RUNNER_TEMP/pdf/$name.pdf" -) > /dev/null; then
              echo "::error file=$tex::docs/$name.pdf is out of date with $tex; rebuild and commit it"
              stale=1
            fi
          done
          echo "stale=$stale" >> "$GITHUB_ENV"

      - name: Attach the freshly built PDFs
        uses: actions/upload-artifact@v4
        with:
          name: docs-pdf
          path: ${{ runner.temp }}/pdf/*.pdf

      - name: Fail if a committed PDF is stale
        if: env.stale == '1'
        run: exit 1
