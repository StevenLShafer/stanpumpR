# The grids' browser suite (tests/playwright) on BrowserStack Automate.
#
# Run by hand from the Actions tab ("Run workflow"), on the branch chosen
# there: the app runs on the runner in Shiny's test mode, and the browsers
# are on BrowserStack, reaching it through a BrowserStack Local tunnel
# (tests/playwright/browserstack.js, README.md there).  Whether the suite
# should also run on pull requests is an open decision
# (docs/grid-replacement.md, "Decisions for Steven Shafer", 5).
#
# Needs the repository secrets BROWSERSTACK_USERNAME and
# BROWSERSTACK_ACCESS_KEY (Settings, Secrets and variables, Actions), from
# the BrowserStack account's settings.  Each run uses the account's
# Automate minutes: a full run on one platform takes longer than the 7
# minutes it takes locally, every action crossing the tunnel.

name: Browser suite (BrowserStack)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Browser and operating system
        type: choice
        default: windows-chrome
        options:
          - windows-chrome
          - windows-edge
          - macos-chrome
          - macos-webkit
          - windows-firefox
      files:
        description: Test files
        type: choice
        default: both
        options:
          - both
          - dose-grid.test.js
          - table-grid.test.js

permissions:
  contents: read

# BrowserStack plans limit parallel sessions: one run at a time
concurrency:
  group: browserstack-browser-suite
  cancel-in-progress: false

jobs:
  browser-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      RENV_CONFIG_AUTOLOADER_ENABLED: FALSE
      PLAYWRIGHT_VERSION: 1.63.0
      BROWSERSTACK_LOCAL_VERSION: 1.5.16
    steps:
      - name: Check the BrowserStack credentials are set
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
        run: |
          if [ -z "$BROWSERSTACK_USERNAME" ] || [ -z "$BROWSERSTACK_ACCESS_KEY" ]; then
            echo "::error::Add the repository secrets BROWSERSTACK_USERNAME and BROWSERSTACK_ACCESS_KEY first."
            exit 1
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 #v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 #v2
        with:
          extra-packages: any::pkgload

      # Playwright only as a client: the browsers are BrowserStack's
      - name: Install Playwright and BrowserStack Local
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/node" \
            "playwright@$PLAYWRIGHT_VERSION" "browserstack-local@$BROWSERSTACK_LOCAL_VERSION"
          echo "NODE_PATH=$RUNNER_TEMP/node/node_modules" >> "$GITHUB_ENV"

      - name: Run the suite on BrowserStack
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          STANPUMPR_BROWSERSTACK: ${{ inputs.platform }}
          STANPUMPR_RSCRIPT_ARGS: --no-init-file
          FILES: ${{ inputs.files }}
        run: |
          if [ "$FILES" = "both" ]; then node tests/playwright/run.js; else node tests/playwright/run.js "$FILES"; fi

      - name: The app's log
        if: failure()
        run: tail -n 300 /tmp/stanpumpR-playwright-7400.log || true
