# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# see https://www.tidyverse.org/blog/2022/06/actions-2-0-0/ for info on setup-r-dependencies@v2
#
# Production deploys once R-CMD-check has passed on a push to master (the
# workflow_run trigger), and installs exactly the commit that was checked.
# Until 2026-10-14 the deploy started on the push itself, in parallel with the
# check, so a commit could reach production before, or without, a green check;
# and it installed the default branch at install time rather than the
# checked-out commit, so a merge in the meantime could put a different revision
# in the live package than in the deployment run.  A manual run
# (workflow_dispatch) deploys the commit it is run on, unchecked, for the case
# where the check is red for a reason unrelated to the app.  The deployed
# commit is written into config.yml (`commit`), which the app shows in its
# debug log and the Source link's tooltip (stanpumpRBuild()); shinyapps.io
# installs the package from the manifest, so the DESCRIPTION's RemoteSha is
# not there to read on the server.
#
# Secrets (2026-11-02): the shinyapps.io token and the mail credential this job
# uses should be secrets of the `production` environment only, not of the
# repository, so that no other job (in particular the PR preview, which runs a
# PR's code; see shiny-pr-2-deploy.yaml) can read them.  The environment has no
# required reviewer, by the maintainer's choice, so a push to master deploys
# without a second person: an accepted risk, recorded in AGENTS.md (Deploy).
#
# Single Paper Review (2026-11-10, Shafer: "default to my own key" for now):
# the operator's Anthropic key is written into config.yml as
# anthropic_api_key from the first of the secrets PAPER_REVIEW_ANTHROPIC_API_KEY,
# STANPUMPR_ANTHROPIC_API_KEY or ANTHROPIC_API_KEY that is set (a repository
# or `production` secret), and every use of it is reported to
# PAPER_REVIEW_USAGE_EMAIL (a variable; by default the app's own mail
# account).  Set the variable PAPER_REVIEW_SHARED_KEY to "false" to withdraw
# the key, so that users must enter their own (R/paper-review-usage.R).  The
# PR preview is never given the key (see shiny-pr-2-deploy.yaml).
on:
  workflow_run:
    workflows: [R-CMD-check]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

name: Deployment Production

permissions:
  contents: read

# One production application, so one group for every run that targets it.  See
# the note in shiny-pr-2-deploy.yaml: shinyapps.io returns HTTP 409 if a deploy
# is already in progress for the application.
concurrency:
  group: shiny-deploy-production
  cancel-in-progress: false

jobs:
  deployment-production:
    # The check runs on pull requests too; only a successful check of a push
    # to master deploys.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://stanpumpr.io
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The commit to deploy: the one the check ran on, or the one a manual
      # run was started on.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - name: Record the commit being deployed
        run: |
          echo "Deploying ${{ github.repository }}@${DEPLOY_SHA}"
          echo "### Production deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${DEPLOY_SHA}\` (checked out and installed)" >> "$GITHUB_STEP_SUMMARY"

      - uses: r-lib/actions/setup-pandoc@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 #v2

      - uses: r-lib/actions/setup-r@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 #v2
        with:
          r-version: 'renv'
          use-public-rspm: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev

      - uses: r-lib/actions/setup-renv@5cc1f0d89c5281319eaa97952fe65a6d55e6f816 #v2

      - name: Install stanpumpR from GitHub at the deployed commit
        run: |
          pkg_ref <- paste0("${{ github.repository }}@", Sys.getenv("DEPLOY_SHA"))
          remotes::install_github(pkg_ref, upgrade = "never", force = TRUE)
          find.package("stanpumpR") # force a failure if package didn't install so GHA won't continue
          installed <- utils::packageDescription("stanpumpR")$RemoteSha
          if (!identical(installed, Sys.getenv("DEPLOY_SHA")))
            stop("Installed commit ", installed, " is not the deployed commit ", Sys.getenv("DEPLOY_SHA"))
        shell: Rscript {0}

      - name: Remove renv lockfile
        run: sudo rm renv.lock  # now that all pacakges have correct versions, remove lockfile
                                # because deployApp() will fail if it sees this lockfile
                                # see https://github.com/rstudio/rsconnect/issues/1315

      - name: Authorize and deploy app
        env:
          PAPER_REVIEW_KEY: ${{ secrets.PAPER_REVIEW_ANTHROPIC_API_KEY || secrets.STANPUMPR_ANTHROPIC_API_KEY || secrets.ANTHROPIC_API_KEY }}
          PAPER_REVIEW_USAGE_EMAIL: ${{ vars.PAPER_REVIEW_USAGE_EMAIL }}
          PAPER_REVIEW_SHARED_KEY: ${{ vars.PAPER_REVIEW_SHARED_KEY }}
        run: |
          shinyConfig <- list(
            default = list(
              email_username = "${{ secrets.SHINY_CONFIG_EMAIL_USERNAME }}",
              email_password = "${{ secrets.SHINY_CONFIG_EMAIL_PASSWORD }}",
              debug = 0,
              commit = Sys.getenv("DEPLOY_SHA")
            )
          )
          # Single Paper Review's shared key (see the note at the top).  Said
          # in the summary as set or not, never shown.
          key <- Sys.getenv("PAPER_REVIEW_KEY")
          shared <- !identical(tolower(Sys.getenv("PAPER_REVIEW_SHARED_KEY")), "false")
          if (nzchar(key)) shinyConfig$default$anthropic_api_key <- key
          if (!shared) shinyConfig$default$paper_review_shared_key <- FALSE
          if (nzchar(Sys.getenv("PAPER_REVIEW_USAGE_EMAIL")))
            shinyConfig$default$paper_review_usage_email <- Sys.getenv("PAPER_REVIEW_USAGE_EMAIL")
          cat("Single Paper Review: ", if (!nzchar(key)) "no shared key (users must enter their own)"
              else if (!shared) "shared key withdrawn (users must enter their own)"
              else "the shared key is every user's default", "\n",
              file = Sys.getenv("GITHUB_STEP_SUMMARY"), append = TRUE, sep = "")
          rm(key)
          yaml::write_yaml(shinyConfig, "config.yml", fileEncoding = "UTF-8")
          rsconnect::setAccountInfo("${{ vars.SHINY_ACCOUNT }}", "${{ secrets.SHINY_TOKEN }}", "${{ secrets.SHINY_SECRET }}")
          rsconnect::deployApp(
            appName = "${{ vars.SHINY_APP_NAME }}", account = "${{ vars.SHINY_ACCOUNT }}",
            appDir = ".", appFiles = c("app.R", "config.yml"), forceUpdate = TRUE
          )
        shell: Rscript {0}
